name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Workspace packages resolve each other through their built dist/ entry points
      # (gitignored), so the packs and schema must be built before core's tests import them.
      - run: pnpm build
      - run: pnpm test

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Per-route gzipped JS budgets (SITE_DEV_PLAN.md section 8).
      - run: pnpm --filter toonstrip-site test:budgets
      - run: pnpm --filter toonstrip-site exec playwright install --with-deps chromium
      - run: pnpm --filter toonstrip-site test:e2e
